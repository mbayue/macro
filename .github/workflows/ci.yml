name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit and property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build:web

  vm:
    name: real-docker containment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The suite pulls the pinned k6 image and builds the egress proxy image on
      # first run; GitHub runners have Docker with runc, and their cgroups
      # enforce the 1 GiB memory cap eagerly, so the containment probe passes
      # all five actions here.
      - run: bun run test:vm
