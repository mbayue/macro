<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#001e2b">
<title>Macro</title>
<meta name="description" content="Macro turns a plain-words description of expected traffic into a safe, measured load test.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/landing/fonts/stack-sans-text.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/landing/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/landing/fonts/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/app/tailwind.css">
<script src="/landing/landing-early.js"></script>
</head>
<body>
<div id="root">
  <div class="boot-screen" role="status" aria-label="Loading Macro">
    <div class="boot-card">
      <div class="boot-logo">
        <img src="/landing/img/datum-m.svg" width="28" height="28" alt="" aria-hidden="true">
        <span class="boot-brand">Macro</span>
      </div>
      <div class="boot-indicator">
        <span class="spinner" aria-hidden="true"></span>
        <span class="boot-text">Loading workspace…</span>
      </div>
    </div>
    <noscript><p class="boot-noscript">Macro needs JavaScript to run.</p></noscript>
  </div>
</div>
<script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
