# Macro on the `macro` VM. One command, run from the repository root:
#   docker compose -f deploy/macro/docker-compose.yml up -d --build
#
# Host preconditions: Docker with Compose, the runsc runtime registered (or
# SANDBOX_RUNTIME=runc in .env), a completed <repo>/.env, and the Cloudflare
# Origin CA certificate at /etc/macro/tls/origin.pem and /etc/macro/tls/origin.key.
name: macro

services:
  caddy:
    image: caddy:2
    container_name: macro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/macro/tls/origin.pem:/etc/macro/tls/origin.pem:ro
      - /etc/macro/tls/origin.key:/etc/macro/tls/origin.key:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - macro-api

  # Least-privilege Docker API proxy (Tecnativa, pinned by digest): the ONLY
  # container that mounts the Docker socket. It forwards just the endpoints
  # Macro_API uses — container create/start/wait/kill/inspect/logs/remove,
  # network create/connect/list/remove, image inspect, /info — and answers 403
  # for everything else (exec, build, volumes, swarm, secrets, image pull...).
  # The HAProxy defaults (timeout server/client 10m) cover the longest
  # container wait a Stage can produce (~3.5 minutes).
  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: macro-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      INFO: "1"
      ALLOW_START: "1"
      ALLOW_RESTARTS: "1"
      # Non-GET methods, still scoped to the enabled sections above.
      POST: "1"
      PING: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No `ports:` on purpose: only macro-api reaches it, over the Compose network.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  macro-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: macro-api:latest
    container_name: macro-api
    restart: unless-stopped
    # Compose reads this file on the host and injects it into this container only.
    env_file: ../../.env
    environment:
      # Same path inside and outside: sandbox bind mounts are resolved by the host daemon.
      DATA_DIR: /var/lib/macro
      # Docker over TCP through the socket proxy above; no socket is mounted here.
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - /var/lib/macro:/var/lib/macro
    # No `ports:` on purpose: only Caddy reaches this service, over the Compose network.
    # The server must listen on 0.0.0.0 (Bun's default) for Caddy to connect.
    expose:
      - "3000"
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      socket-proxy:
        condition: service_started
      macro-proxy:
        condition: service_completed_successfully

  # Build-only: produces the macro-proxy:latest image that Macro_API starts per Run,
  # then exits immediately. The container itself is never used.
  macro-proxy:
    build:
      context: ../..
      dockerfile: proxy/Dockerfile
    image: macro-proxy:latest
    container_name: macro-proxy-build
    entrypoint: ["true"]
    command: []
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
