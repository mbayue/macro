<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#001e2b">
<title>Macro</title>
<meta name="description" content="Macro turns a plain-words description of expected traffic into a safe, measured load test.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/landing/fonts/stack-sans-text.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/landing/fonts/stack-sans-headline-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/app/app.css">
<script src="/landing/landing-early.js"></script>
</head>
<body>
<div id="root">
  <div class="boot-screen" role="status" aria-label="Loading Macro">
    <div class="boot-card">
      <div class="boot-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#00dc82" />
          <path d="M7 17V7l5 6 5-6v10" stroke="#001e2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="boot-brand">Macro</span>
      </div>
      <div class="boot-indicator">
        <span class="spinner" aria-hidden="true"></span>
        <span class="boot-text">Loading workspace…</span>
      </div>
    </div>
    <noscript><p class="boot-noscript">Macro needs JavaScript to run.</p></noscript>
  </div>
</div>
<script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
